<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход — Codeforces Tracker</title>
    <link rel="icon" type="image/png" sizes="64x64" href="codeforces.png" />
    <link rel="stylesheet" href="colors.css" />
    <link rel="stylesheet" href="auth.css" />
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Codeforces Tracker</h1>
            <h2>Вход</h2>

            <form id="login-form">
                <div class="form-group">
                    <input type="text" id="login" placeholder="Логин" required autocomplete="username" />
                </div>

                <div class="form-group">
                    <input type="password" id="password" placeholder="Пароль" required
                        autocomplete="current-password" />
                </div>

                <div class="form-group checkbox">
                    <label>
                        <input type="checkbox" id="remember-me" />
                        Запомнить меня
                    </label>
                </div>

                <div id="error-message" class="error-message hidden"></div>

                <button type="submit" class="auth-btn">Войти</button>
            </form>

            <p class="auth-link">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </p>
        </div>
    </div>

    <script src="full-auth.js"></script>
</body>

</html>
