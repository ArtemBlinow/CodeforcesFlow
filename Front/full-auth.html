<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Вход / Регистрация</title>
    <link rel="icon" type="image/png" sizes="64x64" href="logo.png" />
    <link rel="stylesheet" href="colors.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1><a href="/">Codeforces Flow</a></h1>

            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Вход</button>
                <button class="tab-btn" data-tab="register">Регистрация</button>
            </div>

            <form id="login-form" class="auth-form active">
                <input type="text" id="login-username" name="username" autocomplete="username" placeholder="Логин"
                    required>
                <input type="password" id="login-password" name="password" autocomplete="current-password"
                    placeholder="Пароль" required>
                <label class="checkbox">
                    <input type="checkbox" id="remember-me">
                    <span>Запомнить меня</span>
                </label>
                <div id="login-error" class="error hidden"></div>
                <button type="submit">Войти</button>
            </form>

            <form id="register-form" class="auth-form">
                <input type="text" id="reg-username" name="username" autocomplete="username" placeholder="Логин"
                    required>
                <input type="password" id="reg-password" name="password" autocomplete="new-password"
                    placeholder="Пароль" required>
                <div id="reg-error" class="error hidden"></div>
                <button type="submit">Зарегистрироваться</button>
            </form>
        </div>
    </div>
    <script src="full-auth-page.js"></script>
</body>

</html>
