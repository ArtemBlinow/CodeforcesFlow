<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — Codeforces Tracker</title>
  <link rel="icon" type="image/png" sizes="64x64" href="codeforces.png" />
  <link rel="stylesheet" href="colors.css" />
  <link rel="stylesheet" href="auth.css" />
</head>

<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>Codeforces Tracker</h1>
      <h2>Регистрация</h2>

      <form id="register-form">
        <div class="form-group">
          <input type="text" id="login" placeholder="Логин (мин. 3 символа)" required autocomplete="username" />
        </div>

        <div class="form-group">
          <input type="password" id="password" placeholder="Пароль (мин. 4 символа)" required
            autocomplete="new-password" />
        </div>

        <div class="form-group">
          <input type="password" id="confirm-password" placeholder="Повторите пароль" required autocomplete="off" />
        </div>

        <div id="error-message" class="error-message hidden"></div>

        <button type="submit" class="auth-btn">Зарегистрироваться</button>
      </form>

      <p class="auth-link">
        Уже есть аккаунт? <a href="login.html">Войти</a>
      </p>
    </div>
  </div>

  <script src="register.js"></script>
</body>

</html>
