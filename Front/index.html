<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codeforces Flow</title>
  <link rel="icon" type="image/png" sizes="64x64" href="logo.png" />
  <link rel="stylesheet" href="colors.css" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="auth-container">
    <header class="auth-header">
      <h1>Codeforces Flow</h1>
      <p class="auth-tagline">Следи за прогрессом. Ставь цели. Решай задачи.</p>
    </header>

    <main class="auth-main">
      <form id="auth-form" class="auth-form">
        <div class="form-field">
          <h2>Хэндл</h2>
          <input type="text" id="handle-input" placeholder="Например: tourist" autocomplete="off" />
          <div id="handle-error" class="error-message"></div>
        </div>

        <button type="submit" class="auth-submit-btn">
          Войти
        </button>
      </form>

      <div id="guest-notice" class="guest-notice" style="display: none;">
        <p>
          <span class="guest-label">Гостевой режим</span>
          <a href="/auth" id="show-register" class="register-link">Авторизация</a>
        </p>
      </div>

      <footer>
        <p> Данные берутся только из публичного API Codeforces.</p>
        <p> Хэндл не привязан к аккаунту — вы можете использовать любой присутствующий на codeforces профиль!</p>
      </footer>
  </div>

  <div class="developer-info-footer">
    <p>// Разработано Блиновым Артёмом</p>
  </div>

  <script src="auth.js"></script>
</body>

</html>
